[project]
name = "gazebo-maptiles"
version = "0.1.0"
description = "Generate a tilemap from an image taken inside a gazebo simulator and launch a server that provides them"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catkin-pkg>=1.1.0",
    "fastapi[standard]>=0.140.4",
    "lark>=1.3.1",
    "lxml>=6.1.1",
    "lxml-stubs>=0.5.1",
    "numpy>=2.5.1",
    "packaging>=26.2",
    "watchdog>=6.0.0",
]

[project.scripts]
cli = "gazebo_maptiles.main:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "serve_tiles:app"
